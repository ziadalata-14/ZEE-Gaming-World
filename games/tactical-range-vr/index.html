/* Quiet procedural sound design, unlocked only by a user action. */
class RangeAudio{
 constructor(){this.ctx=null;this.nextBeat=0;this.step=0}
 unlock(){try{if(!this.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;this.ctx=new C();this.master=this.ctx.createGain();this.master.gain.value=.46;this.master.connect(this.ctx.destination);this.noise=this.ctx.createBuffer(1,this.ctx.sampleRate*.3,this.ctx.sampleRate);const a=this.noise.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}if(this.ctx.state==='suspended')this.ctx.resume().catch(()=>{});}catch(e){console.info('Audio unavailable',e.message)}}

 play(name,on=true){if(!on)return;switch(name){case 'balloonPop':this.burst(.085,.38,2700);this.tone(220,.055,.16,'triangle',0,70);this.tone(920,.06,.07,'sine',.04,560);break;
 case 'ceramicBreak':this.burst(.21,.29,3500);[620,940,1530].forEach((f,i)=>this.tone(f,.12,.07,'triangle',i*.024,220));break;
 case 'glassBreak':this.burst(.18,.24,5600);[2300,3100,4200,1700].forEach((f,i)=>this.tone(f,.12,.045,'sine',i*.033,f*.55));break;
 case 'woodBreak':this.burst(.21,.30,1400);this.tone(95,.15,.19,'triangle',0,38);this.burst(.07,.18,3600);break;
 case 'knockdown':this.burst(.13,.20,900);this.tone(110,.12,.1,'triangle',.04,40);break;
 case 'burst':[523,659,784,1047].forEach((f,i)=>this.tone(f,.15,.09,'triangle',i*.04));break;

}
