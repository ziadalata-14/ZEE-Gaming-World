<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZEE Tactical Range VR</title><style>body{margin:0;background:#08101a;color:#eef6ff;font:16px system-ui}canvas{display:block}#panel{position:fixed;top:15px;left:15px;background:#101e30e8;border:1px solid #6684a0;border-radius:14px;padding:15px;max-width:320px}button,select{padding:10px;margin:5px;background:#f5bf69;color:#152032;border:0;border-radius:7px;font-weight:700}#stats{line-height:1.8}#overlay{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;font-size:clamp(50px,12vw,150px);font-weight:900;text-shadow:0 4px 25px black}#results{position:fixed;inset:0;background:#030914d9;display:none;place-items:center}#resultCard{background:#17283c;border:1px solid #6785a1;border-radius:18px;padding:30px;text-align:center;min-width:min(360px,85vw)}#reticle{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;color:#ffdd89;font-size:26px}small{color:#b9ccdb}</style></head><body><div id="panel"><strong>🎯 ZEE TACTICAL RANGE VR</strong><div id="stats">Wave 1 · Score 0 · Shots 0</div><label>Target speed <select id="speed"><option value="0.7">Slow</option><option value="1" selected>Normal</option><option value="1.5">Fast</option><option value="2">Expert</option></select></label><br><button id="start">START WAVE</button><button id="vr">ENTER VR</button><button id="reload">RELOAD (R)</button><div id="ammo">Ammo 12 / ∞</div><small>Desktop: mouse aim/click to shoot, R reload. Quest 3: right trigger shoots, A reloads. Stand still and aim toward the crates.</small><div id="status" role="status"></div></div><div id="reticle">＋</div><div id="overlay"></div><div id="results"><div id="resultCard"><h1 id="resultTitle">Wave complete</h1><div id="resultStats"></div><button id="next">NEXT WAVE</button><button id="retry">RETRY</button></div></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
import {VRButton} from 'https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/webxr/VRButton.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x101c2b);scene.fog=new THREE.Fog(0x101c2b,22,55);const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.05,90);camera.position.set(0,1.65,8);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.xr.enabled=true;document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xa6c9ff,0x32332b,2));const light=new THREE.DirectionalLight(0xffe3ae,2.2);light.position.set(-4,10,6);scene.add(light);
const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.8});const floorMat=mat(0x3b4853),wallMat=mat(0x303e50),wood=mat(0x9a6a3b),metal=mat(0x586b7c),targetMat=mat(0xe6d7b4);function box(w,h,d,x,y,z,m){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);scene.add(o);return o}box(25,.2,28,0,-.1,-4,floorMat);box(25,9,.3,0,4.5,-18,wallMat);box(.3,9,28,-12.5,4.5,-4,wallMat);box(.3,9,28,12.5,4.5,-4,wallMat);box(25,.3,28,0,9,-4,wallMat);for(let i=0;i<8;i++){const lamp=box(1,.06,1,-9+(i%4)*6,8.8,3-Math.floor(i/4)*12,mat(0xf1d9a3));const p=new THREE.PointLight(0xffdf9c,10,13);p.position.copy(lamp.position);scene.add(p)}const crates=[];for(let i=0;i<18;i++){let x=-10+(i%6)*4+Math.sin(i*9)*.65,z=-3-Math.floor(i/6)*5;let h=.9+(i%3)*.36;const c=box(1.5,h,1.5,x,h/2,z,i%4===0?metal:wood);crates.push(c);for(let j=-1;j<=1;j+=2)box(.1,h,.12,x+j*.58,h/2,z+.77,wood)}
const targets=[];let wave=0,score=0,shots=0,hits=0,missed=0,escaped=0,active=false,phase='idle',ammo=12,nextSpawn=0,spawned=0,hitTimes=[],waveStart=0;const ray=new THREE.Raycaster(),clock=new THREE.Clock(),overlay=document.querySelector('#overlay');const controller=renderer.xr.getController(0);scene.add(controller);const controller2=renderer.xr.getController(1);scene.add(controller2);const gun=box(.09,.12,.35,0,0,0,metal);controller.add(gun);gun.position.set(0,-.045,-.17);const gun2=gun.clone();controller2.add(gun2);gun2.position.copy(gun.position);
function makeTarget(){const type=Math.random()<.55?'pop':'slide';const x=-9+Math.random()*18,z=-5-Math.random()*10;const group=new THREE.Group();group.position.set(x,0,z);const pole=new THREE.Mesh(new THREE.BoxGeometry(.08,1.3,.08),metal);pole.position.y=.72;group.add(pole);const shape=new THREE.Mesh(new THREE.BoxGeometry(.8,1.25,.1),targetMat);shape.position.y=1.5;group.add(shape);const head=new THREE.Mesh(new THREE.SphereGeometry(.25,12,10),targetMat);head.position.y=2.25;group.add(head);const bull=new THREE.Mesh(new THREE.CircleGeometry(.23,24),mat(0xd43c39));bull.position.set(0,1.6,.057);group.add(bull);scene.add(group);const t={group,type,shape,head,bull,age:0,life:Math.max(1.4,4.5-wave*.35)/Number(document.querySelector('#speed').value),hit:false,baseX:x,origin:performance.now()};if(type==='pop'){group.rotation.x=-Math.PI/2;group.position.y=.12}else{group.position.x=x-1.2;group.position.y=0}for(const o of [shape,head,bull])o.userData.target=t;targets.push(t)}function clearTargets(){for(const t of targets)scene.remove(t.group);targets.length=0}function stats(){document.querySelector('#stats').textContent=`Wave ${wave||1} · Score ${score} · Shots ${shots} · Hits ${hits} · Misses ${missed}`;document.querySelector('#ammo').textContent=`Ammo ${ammo} / ∞`}function finish(){active=false;phase='results';clearTargets();document.querySelector('#resultTitle').textContent=`WAVE ${wave} COMPLETE`;const accuracy=shots?100*hits/shots:0,success=spawned?100*hits/spawned:0;document.querySelector('#resultStats').innerHTML=`Targets presented: ${spawned}<br>Shots fired: ${shots}<br>Successful targets: ${hits}<br>Missed shots: ${missed}<br>Targets escaped: ${escaped}<br>Accuracy: ${accuracy.toFixed(1)}%<br>Target success: ${success.toFixed(1)}%<br>Average reaction: ${hitTimes.length?(hitTimes.reduce((a,b)=>a+b,0)/hitTimes.length).toFixed(2):'—'} s<br><strong>Score: ${score}</strong>`;document.querySelector('#results').style.display='grid'}function start(retry=false){if(!retry)wave=Math.min(5,wave+1);else wave=Math.max(1,wave);clearTargets();score=0;shots=0;hits=0;missed=0;escaped=0;spawned=0;ammo=12;hitTimes=[];active=false;phase='countdown';document.querySelector('#results').style.display='none';let count=3;overlay.textContent=count;const timer=setInterval(()=>{if(phase!=='countdown'){clearInterval(timer);return}count--;overlay.textContent=count>0?count:'GO!';if(count===0){clearInterval(timer);setTimeout(()=>{if(phase==='countdown'){overlay.textContent='';active=true;phase='playing';waveStart=performance.now();nextSpawn=0}},650)}},1000);stats()}function shoot(fromController=null){if(!active||ammo<=0)return;ammo--;shots++;if(fromController){const p=new THREE.Vector3(),q=new THREE.Quaternion();fromController.getWorldPosition(p);fromController.getWorldQuaternion(q);ray.set(p,new THREE.Vector3(0,0,-1).applyQuaternion(q))}else ray.setFromCamera(new THREE.Vector2(0,0),camera);const clickable=[];for(const t of targets)if(!t.hit)clickable.push(t.shape,t.head,t.bull);const found=ray.intersectObjects(clickable,false).find(h=>h.object.userData.target&&!h.object.userData.target.hit);if(found){const t=found.object.userData.target;t.hit=true;hits++;score+=100+Math.max(0,Math.round((t.life-t.age)*20));hitTimes.push(t.age);t.group.rotation.z=(Math.random()-.5)*.8;t.group.rotation.x=-1.3}else missed++;stats();if(ammo===0)document.querySelector('#status').textContent='RELOAD!'}function reload(){ammo=12;document.querySelector('#status').textContent='';stats()}document.querySelector('#start').onclick=()=>{wave=0;start()};document.querySelector('#next').onclick=()=>{if(wave===5)wave=0;start()};document.querySelector('#retry').onclick=()=>start(true);document.querySelector('#reload').onclick=reload;document.addEventListener('keydown',e=>{if(e.code==='KeyR')reload()});renderer.domElement.addEventListener('click',()=>shoot());controller.addEventListener('selectstart',()=>shoot(controller));controller2.addEventListener('selectstart',()=>shoot(controller2));const vrButton=VRButton.createButton(renderer);vrButton.style.display='none';document.body.append(vrButton);document.querySelector('#vr').onclick=()=>vrButton.click();const status=document.querySelector('#status');if(!navigator.xr)status.textContent='WebXR requires a supported headset browser and HTTPS.';window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
renderer.setAnimationLoop(()=>{const dt=Math.min(clock.getDelta(),.05);if(active){const elapsed=(performance.now()-waveStart)/1000;const total=5+wave*3;const interval=Math.max(.45,1.8-wave*.17)/Number(document.querySelector('#speed').value);if(spawned<total&&elapsed>=nextSpawn){makeTarget();spawned++;nextSpawn=elapsed+interval}for(let i=targets.length-1;i>=0;i--){const t=targets[i];t.age+=dt;if(t.hit){t.group.rotation.x=Math.max(-Math.PI/2,t.group.rotation.x-dt*4);if(t.age>t.life+.4){scene.remove(t.group);targets.splice(i,1)}}else{const f=Math.min(1,t.age*.95*Number(document.querySelector('#speed').value));if(t.type==='pop')t.group.rotation.x=-Math.PI/2*(1-f);else t.group.position.x=t.baseX-1.2+1.2*f;if(t.age>t.life){escaped++;scene.remove(t.group);targets.splice(i,1)}}}if(spawned>=total&&targets.length===0)finish()}renderer.render(scene,camera)});stats();
</script></body></html>
