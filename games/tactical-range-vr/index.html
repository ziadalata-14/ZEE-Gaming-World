class RangeAudio{
 constructor(){this.ctx=null;this.nextBeat=0;this.step=0}
 unlock(){try{if(!this.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;this.ctx=new C();this.master=this.ctx.createGain();this.master.gain.value=.46;this.master.connect(this.ctx.destination);this.noise=this.ctx.createBuffer(1,this.ctx.sampleRate*.3,this.ctx.sampleRate);const a=this.noise.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}if(this.ctx.state==='suspended')this.ctx.resume().catch(()=>{});}catch(e){console.info('Audio unavailable',e.message)}}

 burst(len=.09,vol=.28,freq=1400){if(!this.ctx||this.ctx.state!=='running')return;const ctx=this.ctx,t=ctx.currentTime,s=ctx.createBufferSource(),g=ctx.createGain(),f=ctx.createBiquadFilter();s.buffer=this.noise;f.type='lowpass';f.frequency.value=freq;s.connect(f);f.connect(g);g.connect(this.master);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+len);s.start(t);s.stop(t+len+.02);s.onended=()=>{s.disconnect();g.disconnect();f.disconnect()}}

async function enterVR(){audio.unlock();if(enteringVR||xrSession)return;if(!window.isSecureContext){toast('VR needs HTTPS. Open the published GitHub Pages game in Quest Browser.');return}if(!navigator.xr){toast('VR is unavailable in this browser. Open this game in Quest Browser, then Enter VR.');return}enteringVR=true;if(phase==='playing'||phase==='countdown')pause();let session=null;try{
